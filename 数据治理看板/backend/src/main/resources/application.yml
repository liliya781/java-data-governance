server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:datagov;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.nene.datagov.mapper: debug
